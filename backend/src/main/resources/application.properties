# ===== Server =====
server.port=8080

# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/tripwise_ai
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
# 256-bit+ secret, base64 or plain string (>=32 chars). Override in production via env var.
app.jwt.secret=${JWT_SECRET:tripwise-ai-super-secret-key-change-this-in-production-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== CORS =====
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===== AI (Google Gemini free tier) =====
# Get a free key at https://aistudio.google.com/apikey. Leave blank to always use the
# rule-based fallback generator (ItineraryGeneratorService).
app.ai.gemini.enabled=${GEMINI_ENABLED:true}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
app.ai.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:25000}

# ===== Logging =====
logging.level.com.tripwise.ai=INFO
