# ===== Server =====
# Render injects PORT at runtime; defaults to 8080 for local dev.
server.port=${PORT:8080}

# ===== PostgreSQL (Supabase in production) =====
# Local dev default below. In production, set these via env vars to Supabase's
# connection string (Project Settings -> Database -> Connection string -> JDBC,
# using the "Transaction pooler" host/port on Render). Append ?sslmode=require.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tripwise_ai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== Auth (Supabase Auth) =====
# TripWise never issues its own tokens. This backend only verifies JWTs that
# Supabase Auth already issued to the frontend. Get the secret from Supabase:
# Project Settings -> API -> JWT Settings -> JWT Secret.
app.supabase.jwt-secret=${SUPABASE_JWT_SECRET:}

# ===== CORS =====
# Add your Vercel deployment URL here in production (comma-separated list).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===== AI (Google Gemini free tier) =====
# Get a free key at https://aistudio.google.com/apikey. Leave blank to always use the
# rule-based fallback generator (ItineraryGeneratorService).
app.ai.gemini.enabled=${GEMINI_ENABLED:true}
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-flash-latest}
app.ai.gemini.timeout-ms=${GEMINI_TIMEOUT_MS:25000}

# ===== Logging =====
logging.level.com.tripwise.ai=INFO
