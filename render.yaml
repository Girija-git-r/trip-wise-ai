services:
  - type: web
    name: tripwise-ai-backend
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: mvn -q -DskipTests clean package
    startCommand: java -jar target/tripwise-ai-1.0.0.jar
    healthCheckPath: /api/health
    envVars:
      # Supabase connection string (Transaction pooler, port 6543). MUST include
      # both sslmode=require AND prepareThreshold=0 — Supabase's pooler is
      # PgBouncer in transaction mode, which breaks the JDBC driver's default
      # server-side prepared statements ("prepared statement already exists"
      # errors under load without this).
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # Same Project URL used by the frontend, e.g. https://xxxx.supabase.co
      # (used to derive the JWKS endpoint — no shared secret needed)
      - key: SUPABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_ENABLED
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: CORS_ALLOWED_ORIGINS
        sync: false
