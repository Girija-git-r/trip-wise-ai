services:
  - type: web
    name: tripwise-ai-backend
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: mvn -q -DskipTests clean package
    startCommand: java -jar target/tripwise-ai-1.0.0.jar
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_ENABLED
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: CORS_ALLOWED_ORIGINS
        sync: false
